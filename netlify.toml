# Rebel Herd Media — Netlify configuration
# No build step: the repo root is the site.
[build]
  publish = "."

# Send www to the bare domain (set rebelherdmedia.com as the primary domain in Netlify too)
[[redirects]]
  from = "https://www.rebelherdmedia.com/*"
  to = "https://rebelherdmedia.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# CSS and JS are versioned with ?v= in the HTML, so a long cache is safe.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Serverless functions (server-side validation for the inquiry form)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The publish directory is the repo root; never serve function sources as static files.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
